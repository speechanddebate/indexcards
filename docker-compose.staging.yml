services:
  indexcards:
    container_name: indexcards-staging
    build:
      context: .
      dockerfile: Dockerfile
    image: indexcards-staging:latest
    restart: always
    ports:
        - 9101:3000
    environment:
      - NODE_ENV=staging
    volumes:
      - /etc/indexcards/indexcards.config.staging.js:/indexcards/config/config.js:ro
      - /var/log/indexcards:/var/log/indexcards:rw
      - /var/lib/GeoIP:/geoip:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
